<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock-paper-scissors
</title>
    <link rel="stylesheet" href="stype.css">
</head>
<body>
    <div>
        <h1>Rock Paper</h1>
    </div>
    <div class="game-button">
        <div class="button" id="rock">
            <button>Rock</button>
        </div>
        <div class="button" id="papper">
            <button>Papper</button>
        </div>
        <div class="button" id="sijar">
            <button>Sijar</button>
        </div>
    </div>
    <div class="score">
        <div class="you">
            <p class="main-score" id="you-score">0</p>
            <p>You</p>
        </div>
        <div class="com">
            <p class="main-score" id="com-score">0</p>
            <p>Computer</p>
        </div>
    </div>

    <div class="mess-con">
        <p class="mess">Null</p>
    </div>
    
</body>
<script src="script.js"></script>
</html>
